[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-bench"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "torch>=2,<3",
  "transformers>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
spm-memory-resolve = "spm_bench.memory_cli:main"
